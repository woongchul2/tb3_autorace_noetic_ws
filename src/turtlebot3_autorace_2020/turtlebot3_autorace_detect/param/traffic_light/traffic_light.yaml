---
detect:
  traffic_light:
    # The detector consumes unique D405 frames at 30 Hz. These retain the
    # former 10 Hz evidence windows: 3 frames (0.30 s) and 8 frames (0.80 s).
    color_confirmation_frames: 9
    stop_confirmation_frames: 24
    red:
      hue_l: 0
      hue_h: 26
      saturation_l: 239
      saturation_h: 255
      lightness_l: 123
      lightness_h: 250
    yellow:
      hue_l: 19
      hue_h: 33
      saturation_l: 237
      saturation_h: 255
      lightness_l: 231
      lightness_h: 255
    green:
      hue_l: 40
      hue_h: 113
      saturation_l: 210
      saturation_h: 255
      lightness_l: 131
      lightness_h: 255
