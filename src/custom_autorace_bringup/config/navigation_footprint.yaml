# ROS Navigation costmap 공통 설정에 불러올 로봇 수평 외곽입니다.
# base_link 기준: +x 전방, +y 좌측. 단위는 m입니다.
# 측정한 네 방향 극값으로 만든 보수적인 직사각형이므로 실제 외곽을 모두 포함합니다.
footprint:
  - [0.067645, 0.0903]
  - [-0.118073, 0.0903]
  - [-0.118073, -0.0903]
  - [0.067645, -0.0903]

# 외곽의 가장 먼 뒤쪽 모서리는 0.148644957 m입니다.
# footprint를 사용하는 costmap에서는 robot_radius보다 위 polygon이 우선입니다.
footprint_padding: 0.0
