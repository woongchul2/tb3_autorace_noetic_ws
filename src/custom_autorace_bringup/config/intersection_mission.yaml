# Intersection mission parameters. Distances are metres, angles are degrees,
# linear velocities are m/s and angular velocities are rad/s.

mission:
  sign_topic: /detect/signs
  camera_info_topic: /camera/color/camera_info
  odom_topic: /odometry/filtered
  boundary_topic: /detect/lane_boundaries
  cmd_vel_topic: /cmd_vel
  manual_stop_topic: /control/manual_stop
  lane_speed_limit_topic: /control/max_vel
  # This service transfers cmd_vel ownership without publishing a zero command.
  # Manual emergency stop/resume remains /control/lane_following.
  lane_control_service: /control/lane_mission_handoff
  # Independent fail-stop endpoint used only when a handoff response is lost.
  lane_stop_service: /control/lane_following
  # The upstream direction window and the later ordered mission gate are
  # computed independently from AMCL map poses by mission_zone_manager.
  zone_gate_topic: /mission/enable/intersection
  direction_observation_topic: /mission/inside/intersection_direction_observation
  mission_map_pose_topic: /mission/map_pose

  # 9 frames at 30 Hz preserves the former 3-frame/10 Hz evidence window.
  direction_confirm_frames: 9
  # An upstream confirmation remains cached without starting this timeout.
  # Once the ordered gate opens, lane control continues to the normal plane
  # through map_entry_start. Fail closed if AMCL cannot reach it in this time.
  entry_handoff_timeout: 5.0
  entry_takeover_pose_timeout: 0.75
  # The rolling camera path loses connected paint about 135 mm before the
  # surveyed nominal plane on the official approach.  Take over 200 mm before
  # that plane, after the 30 Hz direction streak is complete but while the
  # current camera path is still valid.  The executable cubic still starts at
  # the fresh post-handoff pose; this value does not move any stored waypoint.
  entry_handoff_lead_distance: 0.200
  # Test hook: 0=read camera, 2=force left, 3=force right.
  forced_direction: 0
  # Absolute course-map routes. The camera selector chooses one measured entry
  # branch after a common live-pose alignment; map->odom is frozen before
  # conversion to the common path format. The texture-derived paint is the
  # common validator's line boundary and is also published for RViz.
  map_frame: map
  map_transform_lookup_timeout: 0.20
  map_transform_max_age: 0.50
  map_world_size: 4.0
  map_resolution: 0.01
  map_boundary_inflation: 0.01
  map_snap_max_distance: 0.45
  exit_map_snap_max_distance: 0.05
  map_texture_package: turtlebot3_gazebo
  map_texture_relative_path: models/turtlebot3_autorace_2020/course/materials/textures/course.png
  # This pose defines both the early-handoff reference plane and the measured
  # centre of the straight intersection entrance.  A short live-pose alignment
  # curve reaches it before the selected stored branch begins.  This removes
  # the callback-timing sensitivity of a single live-pose-to-goal cubic.
  map_entry_start: [1.3950, -0.7500]
  map_entry_start_yaw_deg: 180.0
  map_left_entry_goal: [1.2522, -0.9257]
  map_right_entry_goal: [1.2513, -0.5886]
  map_left_arc_entry_yaw_deg: -90.0
  map_right_arc_entry_yaw_deg: 90.0
  map_entry_samples: 100
  entry_alignment_samples: 61
  # The live pose first joins the measured entrance centre using equal 0.25
  # chord tangents.  The stored LEFT/RIGHT branch then uses the common tangent
  # ratios below.  Run-2 and run-3 callback-timing endpoints complete with no
  # predicted stop in the exact rectangular swept-footprint regression.
  entry_alignment_tangent_ratio: 0.25
  entry_start_tangent_ratio: 0.50
  entry_end_tangent_ratio: 0.32
  # Reject a generated entry before motion if it accumulates more than this
  # much steering opposite to the selected LEFT/RIGHT direction or turns so
  # far in either direction that it has become a U-turn-shaped connector.
  # The camera approach can still be finishing its shallow left bend when a
  # RIGHT route is selected.  The observed alignment contributes at most
  # 22.29 degrees before the stored right branch; it is not a wrong-way route.
  entry_max_opposite_turn_deg: 25.0
  entry_max_total_turn_deg: 120.0

  # Camera lane following ends before its painted semicircle starts the
  # unsafe visual convergence.  The selected fixed Bezier carries the robot
  # from that safe handoff pose to the common westbound exit start.  These
  # are independently measured because the texture is not exactly symmetric.
  map_left_exit_control_points:
    - [0.762200, -1.035300]
    - [0.737117, -0.924915]
    - [0.742982, -0.941341]
    - [0.721843, -0.847479]
    - [0.757456, -0.750000]
    - [0.600000, -0.750000]
  map_right_exit_control_points:
    - [0.762200, -0.464700]
    - [0.737117, -0.575085]
    - [0.742982, -0.558659]
    - [0.721843, -0.652521]
    - [0.757456, -0.750000]
    - [0.600000, -0.750000]
  map_exit_branch_samples: 100
  # At lane takeover, connect the measured pose/yaw to this downstream
  # fraction of the selected surveyed branch, then retain the verified branch
  # remainder and shared exit. Tangents scale with the connector chord.
  exit_adaptive_join_ratio: 0.40
  exit_adaptive_tangent_ratio: 0.35
  exit_adaptive_connector_samples: 41

  # The lane controller follows only the selected painted semicircle. A fresh
  # mission_map_pose near its direction-specific branch start transfers
  # cmd_vel back before vision reaches the narrow convergence.
  arc_lane_timeout: 20.0
  arc_lane_max_distance: 1.20
  # The lane controller further reduces this cap from its pixel error. The
  # previous 0.10 cap produced about 0.062 m/s; 0.12 produced about 0.071 m/s
  # and completed three official-start camera-selected runs per direction.
  arc_lane_max_velocity: 0.12
  lane_resume_max_velocity: 0.30
  # Hold zero across two 20 Hz control ticks and require a newer EKF odometry
  # sample before anchoring the separately controlled exit path.
  exit_takeover_settle_time: 0.10
  exit_takeover_pose_timeout: 0.75
  # AMCL is projected onto the complete selected exit branch, so passing its
  # first stored point cannot miss the handoff. This tolerance covers the
  # measured Gazebo AMCL lateral error while the common validator remains the
  # authority for the actual rectangular footprint.
  exit_takeover_max_distance: 0.050

  # Degree-five Bezier control polygon measured down the shared outgoing
  # corridor. The selected branch above joins its first point with a 180
  # degree tangent; the last control edge imposes the 90 degree exit heading.
  map_exit_control_points:
    - [0.600000, -0.750000]
    - [0.341036, -0.750000]
    - [0.295513, -0.678066]
    - [0.256661, -0.509532]
    - [0.250000, -0.615049]
    - [0.250000, -0.300000]
  map_exit_samples: 180
  exit_goal_yaw_deg: 90.0
  exit_path_lookahead: 0.035
  exit_path_goal_tolerance: 0.025
  exit_path_goal_heading_tolerance_deg: 8.0
  exit_path_goal_crossing_max_distance: 0.10
  exit_path_min_velocity: 0.10
  exit_path_linear_velocity: 0.10
  exit_path_entry_velocity: 0.10
  exit_path_exit_velocity: 0.10
  exit_path_max_angular_velocity: 0.90
  exit_path_follow_timeout: 22.0

  # Search and confirm while the lane controller still owns cmd_vel. The
  # narrow AMCL observation region rejects signs elsewhere on the course, and
  # three matching LEFT/RIGHT observations are still required. Accept the
  # direction sign from 3% image area so a useful frame seen before the ordered
  # gate is retained instead of waiting until the lane image becomes stale.
  direction_acquire_min_confidence: 0.62
  direction_tracking_min_confidence: 0.58
  direction_confirm_min_confidence: 0.60
  direction_acquire_min_roi_area_ratio: 0.030
  direction_tracking_min_roi_area_ratio: 0.030
  direction_confirm_min_roi_area_ratio: 0.030
  # GUI/RViz official-start traces delivered usable processed observations up
  # to about 1.01 s apart. This gap preserves that streak without weakening
  # the three-observation or same-direction requirements.
  direction_confirmation_max_gap: 1.20
  direction_search_timeout: 35.0
  # CameraInfo supplies the live resolution; these are startup fallbacks.
  camera_width_fallback: 640
  camera_height_fallback: 480
  # Selected map arc-entry path tracking.
  path_lookahead: 0.035
  path_goal_tolerance: 0.06
  path_goal_heading_tolerance_deg: 8.0
  # Plane crossing catches controller-step overshoot only near the endpoint;
  # it must never complete a path after the robot has diverged metres away.
  path_goal_crossing_max_distance: 0.15
  path_follow_timeout: 20.0
  path_min_velocity: 0.04
  path_entry_velocity: 0.04
  path_exit_velocity: 0.04
  # Direction-specific speed values selected from full-exit tests. Higher
  # command speed was not faster once exit realignment was included, and
  # eventually caused path loss.
  path_linear_velocity: 0.08
  left_path_linear_velocity: 0.12
  right_path_linear_velocity: 0.12
  path_max_angular_velocity: 0.90
  left_path_max_angular_velocity: 0.90
  right_path_max_angular_velocity: 0.90

  # Shared path follower and swept-footprint limits. Mission-specific speed
  # differences stay in the point profile above; the tracking gains are common.
  maximum_lateral_acceleration: 0.08
  linear_acceleration: 0.25
  linear_deceleration: 0.50
  path_angular_acceleration: 1.50
  path_heading_gain: 0.35
  path_curvature_weight: 0.25
  path_lateral_feedback_gain: 1.0
  path_search_ahead_distance: 0.30
  # At the official-start handoff the camera approach can already overlap the
  # outer paint by 20-45 mm. This common-path allowance covers at most 60 mm at
  # station zero and tapers linearly to the normal zero-overlap rule in 0.20 m.
  # The distance covers the measured off-centre handoff plus its complete-stop
  # sweep; the surveyed centreline itself is strictly clear.
  path_initial_line_overlap_allowance: 0.060
  path_line_egress_distance: 0.200
  # The painted semicircle hands off near its branch start. The 2026-09-12
  # official-start RIGHT run measured 21 mm of maximum rectangular overlap
  # while the live-pose connector turned out of the paint. Allow at most
  # 30 mm at station zero, then retain the existing 0.20 m linear taper to
  # the normal zero-overlap rule. This is an egress envelope for an overlap
  # that already exists at takeover, not a route-wide line exclusion bypass.
  exit_path_initial_line_overlap_allowance: 0.030
  exit_path_line_egress_distance: 0.200
  footprint:
    front: 0.067645
    rear: 0.118073
    half_width: 0.0903
    # The finite 1 cm raster cells already contribute a 7.1 mm half-diagonal
    # in the validator. An additional 1.5 mm each remains for Gazebo AMCL and
    # tracking error; a second arbitrary line buffer would close the measured
    # outgoing corridor completely.
    line_margin: 0.0
    localization_error: 0.0015
    tracking_error: 0.0015
  safety:
    reaction_time: 0.10
    stop_distance_margin: 0.005
    odometry_timeout: 0.35
    sweep_step: 0.008
    sweep_angle_step_deg: 3.0

  # The rolling camera-path follower owns the whole semicircle immediately
  # after the common entry path. It also owns the outgoing lane while this
  # controller observes both coloured lines to confirm mission completion.
  boundary_center_x: 500.0
  boundary_timeout: 0.35
  zone_signal_timeout: 0.50
  final_lane_confirm_frames: 9
  final_lane_confirmation_max_gap: 0.20
  final_lane_width_min: 120.0
  final_lane_width_max: 900.0
  final_lane_center_tolerance: 220.0
  final_lane_heading_tolerance_deg: 20.0
  # Match the exit-path speed so the rolling follower does not introduce a
  # second slowdown while the outgoing corridor is being verified.
  final_lane_join_velocity: 0.10
  final_lane_verify_timeout: 6.0
  final_lane_verify_max_distance: 0.30
