sign_detector:
  input_topic: /camera/color/image_raw
  output_topic: /detect/signs
  debug_image_topic: /detect/image_signs
  process_every_n_frames: 1
  opencv_threads: 1
  processing_width: 448
  debug_every_n_frames: 3
  minimum_confidence: 0.45

  # Standalone perception remains active until a mission message exists. In
  # the integrated vehicle launch, skip ORB work between Intersection and
  # Tunnel so lane processing stays current.
  mission_gating:
    enabled: true
    topic: /mission/current
    active_missions: [intersection, tunnel]
    template_filter:
      fail_open_without_mission: false
      standalone_templates: [direction_left, direction_right, tunnel_warning]
      mission_templates:
        intersection: [direction_left, direction_right]
        tunnel: [tunnel_warning]

  # These thresholds are starting values only. Validate them with frames from
  # the mounted D405 under the actual course lighting before relying on signs
  # for control decisions.
  classifiers:
    direction_geometry:
      enabled: true
      blue_hsv_lower: [90, 70, 30]
      blue_hsv_upper: [140, 255, 255]
      white_saturation_max: 90
      white_value_min: 120
      minimum_blue_area_ratio: 0.015
      maximum_blue_area_ratio: 0.50
      minimum_hull_circularity: 0.70
      polygon_epsilon_ratio: 0.01
      minimum_polygon_vertices: 8
      minimum_aspect_ratio: 0.75
      maximum_aspect_ratio: 2.00
      interior_erode_ratio: 0.08
      minimum_arrow_pixels: 200
      asymmetry_deadband: 0.03

    template:
      enabled: true
      package: turtlebot3_autorace_detect
      directory: image
      orb_nfeatures: 1200
      orb_fast_threshold: 5
      ratio_test: 0.75
      ransac_reprojection_threshold: 4.0
      minimum_inlier_ratio: 0.45
      minimum_projected_area: 80.0
      maximum_projected_area_ratio: 0.50
      projection_margin_ratio: 0.20

      entries:
        intersection_warning:
          enabled: true
          file: intersection.png
          min_good_matches: 9
          min_inliers: 6
          priority: 10
        direction_left:
          enabled: true
          file: left.png
          min_good_matches: 8
          min_inliers: 5
          priority: 20
        direction_right:
          enabled: true
          file: right.png
          min_good_matches: 8
          min_inliers: 5
          priority: 20
        construction_warning:
          enabled: true
          file: construction.png
          min_good_matches: 8
          min_inliers: 5
          priority: 10
        tunnel_warning:
          enabled: true
          file: tunnel.png
          min_good_matches: 6
          min_inliers: 4
          priority: 10
        parking:
          enabled: true
          file: parking.png
          min_good_matches: 6
          min_inliers: 4
          priority: 10
        level_crossing_warning:
          enabled: true
          file: stop.png
          min_good_matches: 6
          min_inliers: 4
          priority: 10
